name: Bug Report
description: Report a reproducible problem with JQ Factor Lab.
body:
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include your Python and OS versions, jq-factor-lab version or Git ref, and installation method.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Steps to reproduce
      description: Paste the jq-factor-lab command and arguments with private paths and values redacted. Use synthetic input where possible.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output and exit code
      description: Share the relevant stdout and stderr excerpts with sensitive details removed, plus the exit code.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public sharing
      options:
        - label: I removed real market data, private information, and credentials from this report.
          required: true
