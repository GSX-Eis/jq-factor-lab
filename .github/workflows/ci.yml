name: CI

"on":
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      run_slow_suite:
        description: "Run slow and perf_gate tests in addition to the fast public suite"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build and check distributions
        run: |
          python3 -m pip install build twine
          python3 -m build
          python3 -m twine check --strict dist/*
      - name: Run the installed wheel Quickstart
        run: |
          wheel_dir="$PWD/dist"
          smoke="$(mktemp -d "$RUNNER_TEMP/jq-factor-lab.XXXXXX")"
          trap 'rm -rf -- "$smoke"' EXIT
          cd "$smoke"
          python3 -m venv .venv
          source .venv/bin/activate
          python3 -m pip install "$wheel_dir"/*.whl
          python3 -m pip check
          jq-factor-lab daily-demo --dry-run --compact > daily-plan.json
          test ! -e outputs
          jq-factor-lab daily-demo > daily.json
          jq-factor-lab bar-demo > bar.json
          db="$(python3 -c 'import json; print(json.load(open("bar.json"))["metrics"]["results_db"]["path"])')"
          jq-factor-lab read-bar-evaluations --results-db "$db" > bar-read.json
          if jq-factor-lab dashboard --dry-run --results-db "$db" > dashboard-missing.json; then
            exit 1
          else
            test "$?" -eq 1
          fi
          wheel=("$wheel_dir"/*.whl)
          python3 -m pip install "${wheel[0]}[viz,mcp]"
          python3 -m pip check
          jq-factor-lab dashboard --dry-run --compact --results-db "$db" > dashboard-plan.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          def compact_payload(name):
              text = Path(name).read_text()
              assert len(text.splitlines()) == 1, text
              return json.loads(text)

          plan = compact_payload("daily-plan.json")
          assert plan["ok"] is True and plan["exit_code"] == 0 and plan["dry_run"] is True, plan
          missing = json.loads(Path("dashboard-missing.json").read_text())
          assert missing["error"]["code"] == "missing_optional_dependency", missing
          assert "[viz]" in missing["error"]["fix"] and missing["exit_code"] == 1, missing
          dashboard = compact_payload("dashboard-plan.json")
          assert dashboard["ok"] is True and dashboard["plan"]["read_only"] is True, dashboard

          daily = json.loads(Path("daily.json").read_text())
          assert daily["ok"] is True and daily["exit_code"] == 0, daily
          assert daily["factor"] == "DemoMomentum" and daily["assets"] > 1, daily
          assert daily["ic_observations"]["1D"] > 0, daily
          assert (Path(daily["output_dir"]) / "summary.json").is_file(), daily

          bar = json.loads(Path("bar.json").read_text())
          assert bar["ok"] is True and bar["exit_code"] == 0, bar
          diagnostics = bar["metrics"]["diagnostics_report"]
          assert diagnostics["schema"] == "time_series_diagnostics.v1", diagnostics
          assert diagnostics["horizons"], diagnostics

          read = json.loads(Path("bar-read.json").read_text())
          assert read["ok"] is True and read["exit_code"] == 0, read
          assert read["metrics"]["run_count"] == 1, read
          PY
      - name: Exercise the MCP stdio protocol
        run: |
          python3 -m pip install '.[dev,mcp]'
          python3 -m pip check
          python3 -m pytest -q -p no:cacheprovider tests/test_public_mcp.py

  tests:
    name: Tests (Python ${{ matrix.python-version }}, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        shard: [1, 2, 3, 4]
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Run the public test suite
        run: |
          numba_cache="$(mktemp -d "${RUNNER_TEMP:-/tmp}/jq-numba.XXXXXX")"
          trap 'rm -rf -- "$numba_cache"' EXIT
          export NUMBA_CACHE_DIR="$numba_cache"
          python3 -m pip install '.[dev,synthesis,backtest]'
          python3 -m pip check
          python3 -c 'import vectorbt as vbt; assert hasattr(vbt, "Portfolio")'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.run_slow_suite }}" = "true" ]; then
            marker_expr="not external_data"
          else
            marker_expr="not slow and not perf_gate and not external_data"
          fi
          shard_list="$(
          SHARD_INDEX="${{ matrix.shard }}" SHARD_TOTAL="4" MARKER_EXPR="$marker_expr" python3 - <<'PY'
          from collections import Counter
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tomllib


          def discover_test_files(root: Path) -> list[str]:
              config = tomllib.loads((root / "pyproject.toml").read_text(encoding="utf-8"))
              testpaths = config.get("tool", {}).get("pytest", {}).get("ini_options", {}).get("testpaths", ["tests"])
              files: set[str] = set()
              for base in testpaths:
                  base_path = root / base
                  if not base_path.exists():
                      continue
                  if base_path.is_file():
                      files.add(base_path.relative_to(root).as_posix())
                      continue
                  for pattern in ("test_*.py", "*_test.py"):
                      for path in base_path.rglob(pattern):
                          if path.is_file():
                              files.add(path.relative_to(root).as_posix())
              return sorted(files)


          def collect_test_weights(root: Path, files: list[str], marker_expr: str) -> dict[str, int]:
              command = [
                  sys.executable, "-m", "pytest", "--collect-only", "-q", "-p", "no:cacheprovider",
              ]
              if marker_expr:
                  command.extend(["-m", marker_expr])
              completed = subprocess.run(command, cwd=root, capture_output=True, text=True, check=False)
              if completed.returncode not in (0, 5):
                  raise RuntimeError(
                      f"pytest --collect-only failed ({completed.returncode}):\n"
                      f"{completed.stdout}\n{completed.stderr}"
                  )
              known = set(files)
              counts: Counter[str] = Counter()
              for raw_line in completed.stdout.splitlines():
                  line = raw_line.strip()
                  if "::" not in line:
                      continue
                  file_part = line.split("::", 1)[0].replace("\\", "/")
                  if file_part in known:
                      counts[file_part] += 1
              return {path: counts[path] for path in files}


          def partition_shards(
              files: list[str],
              weights: dict[str, int],
              sizes: dict[str, int],
              total_shards: int,
          ) -> list[list[str]]:
              if total_shards < 1:
                  raise ValueError(f"total_shards must be >= 1, got {total_shards}")
              ordered = sorted(
                  files,
                  key=lambda path: (-weights.get(path, 0), -sizes.get(path, 0), path),
              )
              buckets: list[list[str]] = [[] for _ in range(total_shards)]
              loads = [0] * total_shards
              byte_loads = [0] * total_shards
              for path in ordered:
                  idx = min(
                      range(total_shards),
                      key=lambda i: (loads[i], byte_loads[i], len(buckets[i]), i),
                  )
                  buckets[idx].append(path)
                  loads[idx] += weights.get(path, 0)
                  byte_loads[idx] += sizes.get(path, 0)
              return [sorted(bucket) for bucket in buckets]


          def select_shard(root: Path, shard_index: int, total_shards: int, marker_expr: str) -> list[str]:
              if not (1 <= shard_index <= total_shards):
                  raise ValueError(f"shard_index must be in 1..{total_shards}, got {shard_index}")
              files = discover_test_files(root)
              if not files:
                  raise RuntimeError("No public test files discovered")
              weights = collect_test_weights(root, files, marker_expr)
              sizes = {path: (root / path).stat().st_size for path in files}
              shards = partition_shards(files, weights, sizes, total_shards)
              return shards[shard_index - 1]


          if __name__ == "__main__":
              shard_index = int(os.environ["SHARD_INDEX"])
              total_shards = int(os.environ["SHARD_TOTAL"])
              marker_expr = os.environ.get("MARKER_EXPR", "")
              selected = select_shard(Path.cwd(), shard_index, total_shards, marker_expr)
              if not selected:
                  raise RuntimeError(f"Shard {shard_index}/{total_shards} has no test files")
              print("\n".join(selected))
          PY
          )"
          [ -n "$shard_list" ] || { echo "empty shard" >&2; exit 1; }
          mapfile -t shard_files <<<"$shard_list"
          [ "${#shard_files[@]}" -gt 0 ] || { echo "empty shard" >&2; exit 1; }
          echo "Running shard ${{ matrix.shard }}/4 (${#shard_files[@]} files)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.run_slow_suite }}" = "true" ]; then
            python3 -m pytest -q -p xdist -n auto --dist worksteal -p no:cacheprovider -m "not external_data" "${shard_files[@]}"
          else
            python3 -m pytest -q -p xdist -n auto --dist worksteal -p no:cacheprovider -m "not slow and not perf_gate and not external_data" "${shard_files[@]}"
          fi
