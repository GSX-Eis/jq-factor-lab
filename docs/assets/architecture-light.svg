<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1120" height="320" viewBox="0 0 1120 320" role="img" aria-labelledby="title desc">
  <title id="title">JQ Factor Lab architecture</title>
  <desc id="desc">AI agents call the Harness CLI, which runs quantitative research and produces local evidence.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1f2328; }
    .heading { font-size: 17px; font-weight: 700; }
    .name { font-size: 16px; font-weight: 650; }
    .detail { font-size: 15px; fill: #464f5b; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace; }
    .panel { fill: #f6f8fa; stroke: #d1d9e0; }
    .row { fill: #ffffff; stroke: #d1d9e0; }
    .rule { stroke: #d1d9e0; }
    .icon-bg { fill: #ddf4ff; }
    .icon { fill: none; stroke: #0969da; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .arrow { fill: none; stroke: #657489; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1120" height="320" fill="#ffffff"/>

  <g transform="translate(12 16)">
    <rect class="panel" width="188" height="288" rx="14"/>
    <text class="heading" x="16" y="34">AI Agent Entry</text>
    <path class="rule" d="M16 50H172"/>
    <rect class="icon-bg" x="16" y="69" width="42" height="42" rx="10"/>
    <g class="icon" transform="translate(25 78)">
      <rect x="3" y="6" width="18" height="14" rx="3"/>
      <path d="M12 6V3M1 12v3m22-3v3M8 12v1m8-1v1"/>
    </g>
    <text class="name" x="16" y="140">Claude Code</text>
    <text class="name" x="16" y="164">Cursor · Codex</text>
    <path class="rule" d="M16 182H172"/>
    <text class="detail mono" x="16" y="211">SKILL.md</text>
    <text class="detail mono" x="16" y="238">stdio MCP</text>
  </g>

  <g transform="translate(226 16)">
    <rect class="panel" width="207" height="288" rx="14"/>
    <text class="heading" x="16" y="34">Harness CLI Contract</text>
    <path class="rule" d="M16 50H191"/>
    <rect class="icon-bg" x="16" y="69" width="42" height="42" rx="10"/>
    <g class="icon" transform="translate(25 78)">
      <rect x="2.5" y="4" width="19" height="16" rx="3"/>
      <path d="m7 9 3 3-3 3m6 0h4"/>
    </g>
    <text class="name mono" x="16" y="140">jq-factor-lab</text>
    <path class="rule" d="M16 157H191"/>
    <text class="detail mono" x="16" y="185">--dry-run</text>
    <text class="detail" x="16" y="211">Strict JSON</text>
    <text class="detail" x="16" y="238">Exit Codes</text>
  </g>

  <g transform="translate(459 16)">
    <rect class="panel" width="418" height="288" rx="14"/>
    <text class="heading" x="16" y="34">Quantitative Core</text>
    <path class="rule" d="M16 50H402"/>

    <rect class="row" x="16" y="61" width="386" height="57" rx="8"/>
    <path class="icon" d="M30 78v19h18m-14-5 4-6 4 3 6-9"/>
    <text class="name" x="61" y="83">Factor Compute &amp; Synthesis</text>
    <text class="detail" x="61" y="104">Weighted / LASSO / LightGBM</text>

    <rect class="row" x="16" y="126" width="386" height="57" rx="8"/>
    <path class="icon" d="M30 142v19h19m-14-5v-5m6 5v-11m6 11v-8"/>
    <text class="name" x="61" y="148">Backtest</text>
    <text class="detail" x="61" y="169">Alphalens / VectorBT</text>

    <rect class="row" x="16" y="191" width="386" height="81" rx="8"/>
    <path class="icon" d="M39 206l9 4v5c0 5-3 9-9 12-6-3-9-7-9-12v-5zm-4 10 3 3 5-6"/>
    <text class="name" x="61" y="213">Anti-Overfitting Metrics</text>
    <text class="detail" x="61" y="234">Purged OOS · Adaptive HAC · Bootstrap v2</text>
    <text class="detail" x="61" y="255">TrialLedger · <tspan class="mono">calibration_status</tspan> gate</text>
  </g>

  <g transform="translate(903 16)">
    <rect class="panel" width="205" height="288" rx="14"/>
    <text class="heading" x="16" y="34">Local Evidence &amp; UI</text>
    <path class="rule" d="M16 50H189"/>
    <rect class="icon-bg" x="16" y="69" width="42" height="42" rx="10"/>
    <g class="icon" transform="translate(25 78)">
      <ellipse cx="12" cy="6" rx="8" ry="3"/>
      <path d="M4 6v12c0 4 16 4 16 0V6M4 12c0 4 16 4 16 0"/>
    </g>
    <text class="name" x="16" y="140">DuckDB Bar Store</text>
    <path class="rule" d="M16 157H189"/>
    <text class="detail" x="16" y="185">Read-Only Streamlit</text>
    <text class="detail" x="16" y="211">Auditable Artifacts</text>
  </g>

  <path class="arrow" d="M205 160h15m-5-5 5 5-5 5m223-5h15m-5-5 5 5-5 5m434-5h15m-5-5 5 5-5 5"/>
</svg>
