# OHLC are four copies of a synthetic close index. Use close-to-close returns only.
schema_version: 1
slot_id: kf_us_portfolios_v1_1d
market_domain: custom:kf_us_portfolios
calendar:
  provider: pmc
  options:
    calendar_id: XNYS
    start: '1963-07-01'
    end: '2026-10-31'
bar_feed:
  provider: duckdb_table
  options:
    table: public_bars_1d
    frequency: 1d
    timestamp_anchor: bar_start
    source_timezone: America/New_York
    volume_mode: interval
    data_version: kf_us_portfolios_v1
    column_mapping:
      timestamp_utc: timestamp
      instrument_id: instrument_id
      open: open
      high: high
      low: low
      close: close
      volume: volume
